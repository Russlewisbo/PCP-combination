project:
  type: website
  output-dir: _site
  execute-dir: project
  render:
    - index.qmd
    - studies.qmd
    - prisma.qmd
    - frequentist.qmd
    - bayesian.qmd
    - model-fit.qmd
    - sensitivity.qmd
    - goodness-of-fit.qmd
    - risk-of-bias.qmd
    - conclusions.qmd
    - pcp_echinocandin_meta_writeup.qmd

website:
  title: "PCP Combination Therapy"
  description: >
    Bayesian and frequentist meta-analysis of adjunctive echinocandin + TMP-SMX vs
    TMP-SMX monotherapy for Pneumocystis pneumonia in HIV-negative adults.
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - text: Studies
        menu:
          - href: studies.qmd
            text: Included studies
          - href: prisma.qmd
            text: PRISMA flow
          - href: risk-of-bias.qmd
            text: Risk of bias
      - text: Results
        menu:
          - href: frequentist.qmd
            text: Frequentist
          - href: bayesian.qmd
            text: Bayesian
          - href: model-fit.qmd
            text: Model fit & MCMC
          - href: sensitivity.qmd
            text: Sensitivity analyses
          - href: goodness-of-fit.qmd
            text: Goodness of fit
      - href: conclusions.qmd
        text: Conclusions
      - href: pcp_echinocandin_meta_writeup.qmd
        text: Full write-up
    tools:
      - icon: github
        href: https://github.com/Russlewisbo/PCP-combination
  page-footer:
    center: "Interim analysis — machine-assisted, pending human verification."

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    code-fold: true
    code-summary: "Show code"
    css: styles.css
    include-in-header: assets/translate-head.html
    include-after-body: assets/translate-button.html
